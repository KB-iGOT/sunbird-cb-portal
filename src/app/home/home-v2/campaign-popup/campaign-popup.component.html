@if (isOpen()) {
<div class="cp-backdrop fixed inset-0 flex items-center justify-center p-4" (click)="close()">
  <div class="cp-dialog relative flex flex-col w-full overflow-hidden rounded-2xl" role="dialog" aria-modal="true"
    aria-labelledby="cp-title" (click)="$event.stopPropagation()">

    <button type="button" class="cp-close absolute top-2 right-2 z-10 flex items-center justify-center w-8 h-8 p-0 rounded-full cursor-pointer"
      [attr.aria-label]="'campaignMicrosite.close' | translate" (click)="close()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </button>

    <!-- the banner itself is clickable too -->
    <button type="button" class="block w-full p-0 border-0 bg-transparent cursor-pointer" tabindex="-1" aria-hidden="true"
      (click)="openCampaign()">
      <img class="block w-full h-auto" [src]="content.image" alt="">
    </button>

    <div class="flex flex-col gap-3 p-6">
      <p class="cp-eyebrow m-0 text-xs font-bold uppercase tracking-widest">{{ content.eyebrow }}</p>
      <h2 id="cp-title" class="cp-title m-0 text-2xl font-bold">{{ content.title }}</h2>
      <p class="cp-text m-0 text-sm leading-normal">{{ content.description }}</p>

      <ul class="flex flex-wrap gap-2 m-0 p-0 list-none">
        @for (item of content.meta; track item) {
        <li class="cp-chip px-2 py-1 rounded text-xs font-semibold">{{ item }}</li>
        }
      </ul>

      <div class="flex flex-wrap-reverse items-center justify-end gap-3 mt-2">
        <button type="button" class="cp-dismiss px-4 py-2 border-0 bg-transparent text-sm font-semibold cursor-pointer"
          (click)="close()">{{ content.dismissLabel }}</button>
        <button #cta type="button" class="cp-cta px-5 py-2 border-0 rounded-lg text-sm font-semibold cursor-pointer"
          (click)="openCampaign()">{{ content.ctaLabel }}</button>
      </div>
    </div>
  </div>
</div>
}
