@if (isVisible()) {
<section class="cm-milestones" aria-labelledby="cm-milestones-title">
  @if (config()?.title) {
  <h2 id="cm-milestones-title" class="cm-milestones__title m-0 mb-4 font-semibold">{{ config()?.title }}</h2>
  }

  @if (isJourneyComplete()) {
  <div class="cm-milestones__complete flex items-center gap-2 mb-4 px-4 py-3 rounded-lg text-sm font-bold" role="status">
    {{ labels.journeyComplete | translate }}
  </div>
  }

  <!-- Columns follow the section's own width (see scss): 4 / 2 / 1 -->
  <div class="cm-milestones__grid grid gap-4">
    @for (milestone of milestones(); track milestone.order; let i = $index) {
      @if (milestone.enabled !== false) {
        <sb-uic-milestone-card [milestone]="milestone" [state]="stateAt(i)" [isLoading]="isLoading()"
          (milestoneClick)="openMilestone($event)">
        </sb-uic-milestone-card>
      }
    }
  </div>
</section>

@if (showPopup()) {
<ws-app-milestone-popup [config]="config()?.popup" [milestones]="milestones()" [states]="states() || []"
  (start)="startFromPopup($event)" (closed)="closePopup()">
</ws-app-milestone-popup>
}
}
