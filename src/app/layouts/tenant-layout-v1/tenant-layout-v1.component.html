<!-- Tenant Layout V1: Clean external tenant layout with tenant branding -->

<!-- Tenant Header -->
<header class="tenant-header" *ngIf="navBarRequired && !hideHeaderAndFooter" [hidden]="!showNavbar">
  <div class="tenant-header-inner">
    <!-- Tenant Logo & Branding -->
    <div class="tenant-brand" (click)="navigateToHome()">
      <div>
        <img *ngIf="tenantLogo" [src]="tenantLogo" alt="Tenant Logo" class="tenant-logo" />
        <span class="tenant-name" *ngIf="!tenantLogo">{{ tenantName | titlecase }}</span>
      </div>
      <div class="seperator"></div>
      <div>
        <img src="/assets/instances/eagle/app_logos/KarmayogiBharat_Logo_Horizontal.svg" alt="Karmayogi Bharat"
          class="tenant-logo" />
      </div>

    </div>

    <!-- Search Bar -->
    <div class="flex items-center border search-v3 search-border w-full" id="app-search-bar">
      <div class="w-full search relative">
        <form (submit)="updateQuery(queryControl.value); $event.preventDefault()"
          class="mat-full-radius flex items-center">
          <mat-form-field class="autocomplete-form w-full" color="primary" appearance="outline">
            <ng-container *ngIf="loaderSearching">
              <img [src]="SAKSHAMAI_ICON_LOADER" alt="loader" width="16" class="search-home">
            </ng-container>
            <ng-container *ngIf="!loaderSearching">
              <img src="/assets/icons/top-nav/search.svg" alt="searchicon" class="search-home">
            </ng-container>
            <input matInput type="text" role="combobox" class="global-search-input-element" accesskey="S" #searchInput
              [attr.title]="placeHolder" id="global-search-input" i18n-placeholder="search content"
              placeholder="Search content" i18-aria-label aria-label="search content" [formControl]="queryControl"
              maxlength="100" (input)="loaderSearching = true" autocomplete="off" />
            <ng-container *ngIf="queryControl.value && !loaderSearching">
              <mat-icon matSuffix (click)="clearSearchText();" class="cursor-pointer search-close-icon">close</mat-icon>
            </ng-container>

          </mat-form-field>
          <button mat-flat-button type="submit" class="mat-btn-flat global-search" [disabled]="!queryControl.value"
            [ngClass]="{'disabled-search-btn': !queryControl.value}">Search</button>
        </form>
      </div>
    </div>

    <!-- Right Actions -->
    <div class="tenant-actions">
      <ng-container [@enterAnimation]="visible">
        <div class="explore-more flex items-center">
          <button mat-raised-button class="mat-btn-outline cursor-pointer explore-content-action"
            (click)="navigateToExplore()">
            <div class="flex items-center">
              <mat-icon class="mr-1" svgIcon="course-cataloguee"></mat-icon>
              <div class="flex items-center explore-content-text">
                <span class="">
                  Explore Content
                </span>
              </div>
            </div>
          </button>
        </div>
      </ng-container>

      <!-- User Avatar -->
      <!-- Avatar Trigger -->
      <div class="user-avatar" *ngIf="userName" [matMenuTriggerFor]="profileMenu" (menuOpened)="onProfileMenuOpen()">
        <img *ngIf="userProfileImg" [src]="userProfileImg" alt="Profile" class="avatar-img" />

        <div *ngIf="!userProfileImg" class="avatar-initials">
          <ws-widget-avatar-photo [datalen]="1" [name]="userInfo?.firstName" [datalen]="" [randomColor]="true"
            [photoUrl]="userInfo?.profileImageUrl" size="round-m">
          </ws-widget-avatar-photo>
        </div>
      </div>

      <!-- Menu -->
      <mat-menu #profileMenu="matMenu" class="profile-menu">

        <!-- Profile Header -->
        <div class="profile-header">
          <!-- <div class="profile-avatar">{{ userName.charAt(0) | uppercase }}</div> -->
          <ws-widget-avatar-photo [datalen]="1" [name]="userInfo?.firstName" [datalen]="" [randomColor]="true"
            [photoUrl]="userInfo?.profileImageUrl" size="round-m">
          </ws-widget-avatar-photo>

          <div class="profile-info">
            <div class="profile-name">{{ (userName | titlecase)?.length > 24
              ? (userName | titlecase).slice(0, 24) + '...'
              : (userName | titlecase) }}</div>
            <div class="view-profile" (click)="navigateToProfile('Profile')">View Profile</div>
          </div>
        </div>

        <mat-divider></mat-divider>
        <button mat-menu-item (click)="navigateToMyLearning()">
          My Learning
        </button>
        <button mat-menu-item (click)="navigateToSettings()">
          Settings
        </button>
        <button mat-menu-item (click)="navigateToLogout()">
          Sign-out
        </button>

      </mat-menu>
    </div>
  </div>
</header>

<ng-template #logoutDialog>
  <div class="logout-outer">
    <h1 mat-dialog-title i18n>Logout Now</h1>
    <div class="ws-mat-primary-text text-base pb-2 title-text" *ngIf="isDownloadable" i18n>
      Note: On logging out all the downloaded content will be deleted.
    </div>
    <div mat-dialog-content class="text-base hide-overflow" i18n>
      Are you sure?
    </div>
    <div mat-dialog-actions class="flex-row-reverse my-3">

      <button mat-button class="margin-right-xs ml-10" (click)="dialogRef.close()" [mat-dialog-close] cdkFocusInitial
        i18n>No</button>
      <button mat-flat-button color="warn" [disabled]="disabled" (click)="confirmed()" i18n>
        Yes
      </button>
    </div>
  </div>
</ng-template>

<!-- Content Area -->
<div class="tenant-content"
  [ngClass]="{'tenant-content-with-header': navBarRequired && !hideHeaderAndFooter && showNavbar}">
  <router-outlet></router-outlet>
</div>

<!-- Footer (reuses existing footer if config available) -->
<ws-app-footer class="app-footer" *ngIf="showNavbar && showFooter && headerFooterConfigData && !hideHeaderAndFooter"
  [headerFooterConfigData]="headerFooterConfigData">
</ws-app-footer>
